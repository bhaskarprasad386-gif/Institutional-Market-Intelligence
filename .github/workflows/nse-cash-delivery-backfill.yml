name: NSE cash delivery historical backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cash-delivery-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch missing NSE cash delivery dates for archived F&O sessions
        run: python scripts/nse/fetch_cash_delivery.py --backfill-existing-fo-dates
      - name: Commit cash delivery archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nse-cash-delivery/
          if git diff --cached --quiet; then
            echo "Cash delivery archive is already up to date."
          else
            git commit -m "data: archive NSE cash delivery history [skip ci]"
            git push
          fi
