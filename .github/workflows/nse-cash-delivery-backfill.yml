name: NSE cash delivery historical backfill

on:
  schedule:
    # Retry missing NSE cash sessions every weekday at 20:30 IST.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cash-delivery-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch missing NSE cash delivery dates for archived F&O sessions
        run: python scripts/nse/fetch_cash_delivery.py --backfill-existing-fo-dates
      - name: Build NIFTY 50 EOD indicators from the completed cash archive
        if: always()
        run: python scripts/nse/build_nifty50_eod.py
      - name: Commit cash delivery archive and NIFTY 50 EOD dataset to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nse-cash-delivery/ public/data/nifty50-eod-latest.json public/data/nifty50-constituents.json
          if git diff --cached --quiet; then
            echo "Cash delivery archive is already up to date."
          else
            git commit -m "data: archive NSE cash delivery history [skip ci]"
            git push origin HEAD:main
          fi
