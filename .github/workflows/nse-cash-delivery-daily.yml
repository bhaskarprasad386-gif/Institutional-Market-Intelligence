name: NSE cash delivery daily archive

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cash-delivery-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest available NSE cash delivery date
        run: python scripts/nse/fetch_cash_delivery.py
      - name: Commit cash delivery archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nse-cash-delivery/
          if git diff --cached --quiet; then
            echo "Cash delivery archive is already up to date."
          else
            git commit -m "data: update NSE cash delivery archive [skip ci]"
            git push
          fi
