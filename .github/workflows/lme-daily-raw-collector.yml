name: LME daily raw-data collector
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/lme/daily_collector.py"
      - ".github/workflows/lme-daily-raw-collector.yml"
permissions:
  contents: read
concurrency:
  group: lme-daily-raw-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector syntax
        run: python -m py_compile scripts/lme/daily_collector.py
      - name: Check official sources and download accessible raw reports
        run: python scripts/lme/daily_collector.py
      - name: Publish non-sensitive collection manifest only
        uses: actions/upload-artifact@v4
        with:
          name: lme-daily-manifest-${{ github.run_id }}
          path: lme-raw-output/manifest.json
          if-no-files-found: error
          retention-days: 90
