name: LME public raw report collector

on:
  workflow_dispatch:
  schedule:
    # Run after the 10th-day publication window, allowing for weekends / holidays.
    - cron: "30 10 15 * *"

permissions:
  contents: read

concurrency:
  group: lme-public-raw-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook inspector
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Fetch latest public LME warehouse and queue XLSX
        run: python scripts/lme/fetch_public_reports.py
      - name: Archive unchanged raw workbook and manifest
        uses: actions/upload-artifact@v4
        with:
          name: lme-public-raw-warehouse-queue-${{ github.run_id }}
          path: lme-raw-output/
          if-no-files-found: error
          retention-days: 30
