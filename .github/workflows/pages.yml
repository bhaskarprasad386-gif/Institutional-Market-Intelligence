name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build banking SMA and delivery snapshot from archived NSE cash history
        run: python scripts/nse/build_bank_market_daily.py
      - name: Build complete NSE rollover history from archived sessions
        run: python scripts/nse/build_rollover_history.py
      - name: Build NIFTY 50 constituents and EOD technical matrix
        run: python scripts/nse/build_nifty50_eod.py
      - name: Persist verified NIFTY 50 constituent rows for the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nifty50-eod-latest.json public/data/nifty50-constituents.json
          if git diff --cached --quiet; then
            echo "NIFTY 50 snapshot unchanged."
          else
            git commit -m "data: persist verified NIFTY 50 constituent snapshot [skip ci]"
            git push origin HEAD:main
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
