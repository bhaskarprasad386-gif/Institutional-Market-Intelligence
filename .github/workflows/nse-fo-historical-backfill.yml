name: NSE F&O historical backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD), inclusive; defaults to the first unarchived UDiFF session"
        required: false
        default: "2024-07-13"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD), inclusive; leave blank to use today's UTC date"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nse-daily-data-pages
  cancel-in-progress: false

jobs:
  backfill-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test historical parser and validation
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Backfill all requested dates in safe 31-day batches
        env:
          START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          set -euo pipefail

          start_date="$(printf '%s' "$START_DATE" | xargs)"
          end_date="$(printf '%s' "$INPUT_END_DATE" | xargs)"
          if [[ -z "$end_date" ]]; then
            end_date="$(date -u +%F)"
          fi

          python - "$start_date" "$end_date" <<'PY'
          import sys
          from datetime import date
          for label, raw in (("start_date", sys.argv[1]), ("end_date", sys.argv[2])):
              try:
                  parsed = date.fromisoformat(raw)
              except ValueError as exc:
                  raise SystemExit(f"{label} must be YYYY-MM-DD: {raw!r}") from exc
              if parsed.isoformat() != raw:
                  raise SystemExit(f"{label} must be strict YYYY-MM-DD: {raw!r}")
          if date.fromisoformat(sys.argv[2]) < date.fromisoformat(sys.argv[1]):
              raise SystemExit("end_date must be on or after start_date")
          PY

          cursor="$start_date"
          while [[ "$cursor" < "$end_date" || "$cursor" == "$end_date" ]]; do
            chunk_end="$(python - "$cursor" "$end_date" <<'PY'
          import sys
          from datetime import date, timedelta
          start = date.fromisoformat(sys.argv[1])
          end = min(start + timedelta(days=30), date.fromisoformat(sys.argv[2]))
          print(end.isoformat())
          PY
          )"

            echo "=== Backfilling $cursor through $chunk_end ==="
            python scripts/nse/backfill_fo_history.py --start-date "$cursor" --end-date "$chunk_end"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/nse-fo-history/
            if ! git diff --cached --quiet; then
              git commit -m "data: backfill NSE F&O history $cursor to $chunk_end [skip ci]"
              git push
            else
              echo "No new archive changes for $cursor through $chunk_end."
            fi

            cursor="$(python - "$chunk_end" <<'PY'
          import sys
          from datetime import date, timedelta
          print((date.fromisoformat(sys.argv[1]) + timedelta(days=1)).isoformat())
          PY
          )"
          done
      - name: Build compact full-history rollover metrics\n        run: python scripts/nse/build_rollover_history.py\n      - name: Commit compact rollover history index\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add public/data/nse-fo-history/rollover-metrics.json\n          if ! git diff --cached --quiet; then\n            git commit -m "data: rebuild compact NSE rollover history [skip ci]"\n            git push\n          fi\n      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy historical archive
        id: deployment
        uses: actions/deploy-pages@v4
